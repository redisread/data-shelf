name: macOS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: macOS quality and package
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: Verify dependencies and formatting
        shell: bash
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./...
      - name: Race tests and coverage
        run: go test -race -count=1 -timeout=5m -coverprofile=coverage.out ./...
      - name: Vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build and verify Apple Silicon package
        run: bash scripts/ci-package.sh
      - name: Upload installable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-shelf-macos-arm64-${{ github.sha }}
          path: build/ci/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14
